<!-- Backdrop for mobile drawer -->
<div
  class="mobile-drawer-backdrop d-lg-none"
  [class.show]="menuOpen"
  (click)="closeMenu()"
  aria-hidden="true"
></div>

<nav class="navbar navbar-expand-lg navbar-dark portfolio-navbar">
  <div class="container navbar-inner">
    <!-- Brand -->
    <a class="navbar-brand portfolio-brand" href="#home" (click)="closeMenu()">
      <div class="brand-container">
        <div class="brand-icon">
          <iconify-icon
            icon="mdi:code-tags"
            width="28"
            height="28"
          ></iconify-icon>
        </div>
        <div class="brand-text">
          <strong>Cyrille PIO</strong>
          <small>Software & Data</small>
        </div>
      </div>
    </a>

    <!-- Theme, language & hamburger — visible outside menu on mobile -->
    <div class="mobile-toolbar d-lg-none">
      <button
        tuiButton
        appearance="secondary-grayscale"
        size="s"
        class="theme-toggle-btn"
        [title]="
          isDarkMode ? 'Passer au thème clair' : 'Passer au thème sombre'
        "
        (click)="toggleTheme()"
      >
        <iconify-icon
          [attr.icon]="isDarkMode ? 'mdi:weather-sunny' : 'mdi:weather-night'"
          width="20"
          height="20"
        ></iconify-icon>
      </button>

      <div class="lang-selector">
        <button
          tuiButton
          appearance="secondary-grayscale"
          size="s"
          class="lang-btn"
          [tuiDropdown]="langMenuMobile"
        >
          <span>{{ currentLang }}</span>
          <iconify-icon
            icon="mdi:chevron-down"
            width="14"
            height="14"
          ></iconify-icon>
        </button>
        <ng-template #langMenuMobile>
          <div class="lang-dropdown-menu">
            <button class="lang-item" (click)="selectLanguage('FR')">
              FR (Français)
            </button>
            <button class="lang-item" (click)="selectLanguage('EN')">
              EN (English)
            </button>
          </div>
        </ng-template>
      </div>

      <button
        class="menu-toggle"
        type="button"
        [attr.aria-expanded]="menuOpen"
        [attr.aria-label]="menuOpen ? 'Fermer le menu' : 'Ouvrir le menu'"
        (click)="toggleMenu()"
      >
        <iconify-icon
          [attr.icon]="menuOpen ? 'mdi:close' : 'mdi:menu'"
          width="22"
          height="22"
        ></iconify-icon>
      </button>
    </div>

    <!-- Desktop navbar content -->
    <div class="navbar-collapse portfolio-collapse d-none d-lg-flex">
      <ng-container *ngTemplateOutlet="desktopMenuContent"></ng-container>
    </div>
  </div>
</nav>

<!-- Mobile slide-in panel -->
<aside
  class="mobile-drawer d-lg-none"
  [class.show]="menuOpen"
  role="dialog"
  aria-modal="true"
  aria-label="Menu de navigation"
  [attr.aria-hidden]="!menuOpen"
>
  <div class="mobile-drawer-header">
    <div class="mobile-drawer-brand">
      <div class="brand-icon brand-icon--sm">
        <iconify-icon
          icon="mdi:code-tags"
          width="22"
          height="22"
        ></iconify-icon>
      </div>
      <div class="brand-text">
        <strong>Cyrille PIO</strong>
        <small><i>Software & Data</i></small>
      </div>
    </div>
    <button
      class="menu-toggle drawer-close"
      type="button"
      aria-label="Fermer le menu"
      (click)="closeMenu()"
    >
      <iconify-icon icon="mdi:close" width="24" height="24"></iconify-icon>
    </button>
  </div>

  <div class="mobile-drawer-body">
    <nav class="mobile-nav" aria-label="Sections du portfolio">
      <a
        *ngFor="let item of navItems; let i = index"
        class="mobile-nav-link"
        [href]="item.fragment"
        (click)="closeMenu()"
      >
        <span class="mobile-nav-label">{{ item.label }}</span>
        <iconify-icon
          icon="mdi:arrow-right"
          width="18"
          height="18"
          class="mobile-nav-arrow"
        ></iconify-icon>
      </a>
    </nav>
  </div>

  <div class="mobile-drawer-footer">
    <div class="social-icons">
      <a
        *ngFor="let social of socialLinks"
        [href]="social.url"
        [title]="social.label"
        tuiButton
        appearance="secondary-grayscale"
        size="s"
        class="social-link"
        target="_blank"
        rel="noopener noreferrer"
      >
        <iconify-icon
          [attr.icon]="social.icon"
          width="20"
          height="20"
        ></iconify-icon>
      </a>
    </div>
    <a
      tuiButton
      appearance="primary"
      size="m"
      href="#contact"
      class="portfolio-cta-btn mobile-cta-btn"
      (click)="closeMenu()"
    >
      Me contacter
    </a>
  </div>
</aside>

<!-- Desktop menu content -->
<ng-template #desktopMenuContent>
  <ul class="navbar-nav mx-auto portfolio-nav-list">
    <li class="nav-item" *ngFor="let item of navItems">
      <a
        class="nav-link portfolio-nav-link"
        [href]="item.fragment"
        (click)="closeMenu()"
      >
        {{ item.label }}
      </a>
    </li>
  </ul>

  <div class="navbar-actions">
    <div class="social-icons">
      <a
        *ngFor="let social of socialLinks"
        [href]="social.url"
        [title]="social.label"
        tuiButton
        appearance="secondary-grayscale"
        size="s"
        class="social-link"
        target="_blank"
        rel="noopener noreferrer"
      >
        <iconify-icon
          [attr.icon]="social.icon"
          width="20"
          height="20"
        ></iconify-icon>
      </a>
    </div>

    <div class="controls-group">
      <button
        tuiButton
        appearance="secondary-grayscale"
        size="s"
        class="theme-toggle-btn"
        [title]="
          isDarkMode ? 'Passer au thème clair' : 'Passer au thème sombre'
        "
        (click)="toggleTheme()"
      >
        <iconify-icon
          [attr.icon]="isDarkMode ? 'mdi:weather-sunny' : 'mdi:weather-night'"
          width="20"
          height="20"
        ></iconify-icon>
      </button>

      <div class="lang-selector">
        <button
          tuiButton
          appearance="secondary-grayscale"
          size="s"
          class="lang-btn"
          [tuiDropdown]="langMenuDesktop"
        >
          <span>{{ currentLang }}</span>
          <iconify-icon
            icon="mdi:chevron-down"
            width="16"
            height="16"
          ></iconify-icon>
        </button>
        <ng-template #langMenuDesktop>
          <div class="lang-dropdown-menu">
            <button
              class="lang-item"
              (click)="selectLanguage('FR'); closeMenu()"
            >
              FR (Français)
            </button>
            <button
              class="lang-item"
              (click)="selectLanguage('EN'); closeMenu()"
            >
              EN (English)
            </button>
          </div>
        </ng-template>
      </div>
    </div>

    <a
      tuiButton
      appearance="primary"
      size="m"
      href="#contact"
      class="portfolio-cta-btn"
      (click)="closeMenu()"
    >
      Me contacter
    </a>
  </div>
</ng-template>
